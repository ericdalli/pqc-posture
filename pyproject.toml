[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pqc-posture"
version = "0.1.0"
description = "TLS post-quantum key exchange posture scanner"
requires-python = ">=3.11"
dependencies = []          # stdlib only; the crypto lives in OpenSSL 3.5
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Eric Dalli" }]
keywords = ["tls", "post-quantum", "pqc", "ml-kem", "openssl", "security"]
classifiers = [
  "Topic :: Security :: Cryptography",
  "Programming Language :: Python :: 3.11",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/ericdalli/pqc-posture"

[project.scripts]
pqc-posture = "pqcposture.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
